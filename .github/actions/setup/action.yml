name: Setup pnpm

description: Setup pnpm and run install

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      with:
        version: 10
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install
      shell: bash
