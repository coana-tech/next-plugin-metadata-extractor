name: Lint

on: pull_request

permissions:
  contents: read

jobs:
  install-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint
